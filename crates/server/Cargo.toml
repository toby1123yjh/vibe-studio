[package]
name = "server"
version = "0.1.44"
edition = "2024"
default-run = "server"

[lints.clippy]
uninlined-format-args = "allow"

[dependencies]
api-types = { path = "../api-types" }
deployment = { path = "../deployment" }
executors = { path = "../executors" }
local-deployment = { path = "../local-deployment" }
utils = { path = "../utils" }
git = { path = "../git" }
git-host = { path = "../git-host" }
db = { path = "../db" }
services = { path = "../services" }
workflow = { path = "../workflow" }
worktree-manager = { path = "../worktree-manager" }
workspace-manager = { path = "../workspace-manager" }
embedded-ssh = { path = "../embedded-ssh" }
relay-control = { path = "../relay-control" }
relay-protocol = { path = "../relay-protocol" }
relay-ws = { path = "../relay-ws" }
relay-client = { path = "../relay-client" }
relay-hosts = { path = "../relay-hosts" }
relay-types = { path = "../relay-types" }
relay-tunnel-core = { path = "../relay-tunnel-core" }
relay-webrtc = { path = "../relay-webrtc" }
ws-bridge = { path = "../ws-bridge" }
desktop-bridge = { path = "../desktop-bridge" }
preview-proxy = { path = "../preview-proxy" }
trusted-key-auth = { path = "../trusted-key-auth" }
tokio = { workspace = true }
shlex = "1.3.0"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "sqlite-preupdate-hook", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
ts-rs = { workspace = true }
tower-http = { workspace = true }
schemars = { workspace = true }
sentry = { version = "0.46.2", default-features = false, features = ["anyhow", "backtrace", "panic", "debug-images", "reqwest", "rustls"] }
reqwest = { workspace = true }
rustls = { workspace = true }
aws-lc-sys = { workspace = true }
aws-lc-rs = { workspace = true }
strip-ansi-escapes = "0.2.1"
thiserror = { workspace = true }
os_info = "3.12.0"
futures-util = "0.3"
http = "1"
hyper-util = { version = "0.1", features = ["client-proxy", "client-proxy-system"] }
base64 = "0.22"
mime_guess = "2.0"
rust-embed = "8.2"
url = "2.5"
rand = { version = "0.8", features = ["std"] }
spake2 = { version = "0.5.0-pre.0", features = ["getrandom"] }
sha2 = "0.10"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
ssh-key = { version = "0.6.7", features = ["encryption", "ed25519", "rsa"] }
# Imported SSH keys use russh instead of libssh2's platform-dependent crypto
# backend (Windows WinCNG cannot authenticate Ed25519 keys). Reuse the same
# pure-Rust SSH stack as embedded-ssh, including Linux-to-Windows release builds.
git2 = { workspace = true }
russh = "0.48"
home = "0.5"
hmac = "0.12"
sha1 = "0.10"
percent-encoding = "2"
command-group = { version = "5.0", features = ["with-tokio"] }
ed25519-dalek = "2.2.0"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
# The npm release cross-compiles Linux with zig; Wayland's pkg-config probe is not cross-safe.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
tempfile = "3"
cap-std = "3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
dotenv = "0.15"

[features]
default = []
qa-mode = ["services/qa-mode", "executors/qa-mode"]
