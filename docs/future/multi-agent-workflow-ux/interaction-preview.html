<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Vibe Kanban · 多 Agent 协作交互稿</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f4f6f7;
        --sidebar: #eceff1;
        --surface: #fff;
        --secondary: #f2f4f5;
        --ink: #172027;
        --normal: #34414b;
        --muted: #606e78;
        --border: #dde2e6;
        --brand: #c65016;
        --selection: rgb(216 95 30 / 9%);
        --success: #237444;
        --warning: #906000;
        --danger: #b53737;
        --info: #2f65bd;
        --shadow: 0 12px 32px rgb(0 0 0 / 12%);
        --dots: #d9dfe3;
        font-family: "IBM Plex Sans", "Segoe UI", "Microsoft YaHei", sans-serif;
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
      }
      button,
      select,
      textarea {
        font: inherit;
      }
      a {
        color: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      button,
      a,
      textarea {
        outline-offset: 3px;
      }
      :focus-visible {
        outline: 2px solid var(--brand);
      }
      button {
        transition:
          background 120ms,
          border-color 120ms,
          box-shadow 120ms;
      }
      button:hover:not(:disabled) {
        background: var(--secondary);
      }
      [hidden] {
        display: none !important;
      }
      svg.icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .prototype-bar {
        min-height: 68px;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 18px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .prototype-label {
        font-size: 12px;
        line-height: 1.6;
      }
      .prototype-label strong {
        display: block;
        font-size: 13px;
      }
      .prototype-label span,
      .muted {
        color: var(--muted);
      }
      .scenes {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .scene {
        border: 1px solid transparent;
        border-radius: 7px;
        padding: 8px 12px;
        background: transparent;
        font-size: 13px;
      }
      .scene[aria-pressed="true"] {
        background: var(--selection);
        border-color: var(--brand);
        color: var(--brand);
      }
      .preview-controls {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .btn {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 7px;
        min-height: 36px;
        padding: 7px 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
      }
      .btn.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: white;
      }
      .btn.primary:hover:not(:disabled) {
        filter: brightness(1.08);
        background: var(--brand);
      }
      .btn.danger {
        color: var(--danger);
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
      }
      .icon-button {
        padding: 9px;
        min-width: 36px;
      }
      .shell {
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr);
        height: calc(100dvh - 110px);
        min-height: 610px;
      }
      .sidebar {
        padding: 24px 14px 12px;
        border-right: 1px solid var(--border);
        background: var(--sidebar);
        display: flex;
        flex-direction: column;
        gap: 22px;
        overflow-y: auto;
      }
      .product {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px 4px;
        font-weight: 600;
      }
      .product-mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--ink);
        color: var(--surface);
        font-size: 13px;
      }
      .sidebar nav {
        display: grid;
        gap: 4px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        text-align: left;
        font-size: 13px;
        color: var(--normal);
      }
      .nav-item.active {
        background: var(--surface);
        box-shadow: 0 1px 3px rgb(0 0 0 / 4%);
        color: var(--ink);
        font-weight: 600;
      }
      .section-label {
        padding: 0 12px;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .sidebar-row {
        font-size: 13px;
        line-height: 2.5;
        padding: 0 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding: 8px 12px;
        color: var(--muted);
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .page-header {
        height: 82px;
        flex-shrink: 0;
        padding: 16px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .eyebrow {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 7px;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      .heading-line {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 17px;
        font-weight: 600;
        margin: 0;
      }
      h2 {
        font-size: 15px;
        margin: 0;
      }
      h3 {
        font-size: 13px;
        margin-bottom: 10px;
      }
      .header-actions {
        display: flex;
        gap: 6px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        line-height: 20px;
        color: var(--muted);
        white-space: nowrap;
      }
      .dot {
        width: 6px;
        height: 6px;
        background: currentColor;
        border-radius: 50%;
        display: inline-block;
        flex-shrink: 0;
      }
      .success {
        color: var(--success);
      }
      .running {
        color: var(--info);
      }
      .waiting {
        color: var(--warning);
      }
      .failed {
        color: var(--danger);
      }
      .run-view {
        flex: 1;
        min-height: 0;
        position: relative;
        overflow: hidden;
        background-image: radial-gradient(var(--dots) 0.8px, transparent 0.8px);
        background-size: 24px 24px;
      }
      .canvas {
        position: absolute;
        inset: 0;
        touch-action: none;
        cursor: grab;
        overflow: hidden;
      }
      .canvas.dragging {
        cursor: grabbing;
      }
      .graph {
        width: 850px;
        height: 740px;
        position: absolute;
        left: 40px;
        top: 12px;
        transform-origin: 0 0;
      }
      .connections {
        position: absolute;
        inset: 0;
        width: 850px;
        height: 740px;
        overflow: visible;
      }
      .edge-visible {
        fill: none;
        stroke: var(--border);
        stroke-width: 2;
      }
      .edge-visible.passed {
        stroke: var(--success);
        opacity: 0.55;
      }
      .edge-visible.active {
        stroke: var(--info);
        stroke-dasharray: 5 7;
        animation: travel 1.5s linear infinite;
      }
      .edge-hit {
        fill: none;
        stroke: transparent;
        stroke-width: 18;
        cursor: pointer;
      }
      .edge-hit:focus-visible {
        outline: none;
        stroke: var(--brand);
        stroke-width: 4;
      }
      .node {
        position: absolute;
        width: 216px;
        min-height: 108px;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 14px;
        background: var(--surface);
        text-align: left;
        box-shadow: 0 2px 5px rgb(0 0 0 / 3%);
        cursor: pointer;
      }
      .node:hover {
        border-color: var(--muted);
        box-shadow: 0 4px 12px rgb(0 0 0 / 7%);
      }
      .node[aria-pressed="true"] {
        border-color: var(--brand);
        box-shadow: 0 0 0 2px var(--selection);
      }
      .node-title {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 14px;
        font-weight: 600;
        min-height: 22px;
      }
      .type-icon {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        background: var(--secondary);
        border-radius: 7px;
        color: var(--normal);
      }
      .node-sub {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-top: 12px;
      }
      .node-agent {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
      }
      .port {
        width: 8px;
        height: 8px;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        position: absolute;
        left: calc(50% - 4px);
      }
      .port.top {
        top: -5px;
      }
      .port.bottom {
        bottom: -5px;
      }
      .panel {
        position: absolute;
        right: 24px;
        top: 24px;
        bottom: 24px;
        width: 440px;
        max-width: calc(100% - 48px);
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        z-index: 30;
      }
      .panel.entering {
        animation: panel-in 180ms ease-out;
      }
      .panel-header {
        padding: 16px 18px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
        border-bottom: 1px solid var(--border);
      }
      .panel-header > div {
        flex: 1;
        min-width: 0;
      }
      .panel-header .badge {
        margin-top: 7px;
      }
      .panel-body {
        min-height: 0;
        overflow-y: auto;
        padding: 18px;
        scrollbar-gutter: stable;
      }
      .panel-section + .panel-section {
        border-top: 1px solid var(--border);
        margin-top: 18px;
        padding-top: 18px;
      }
      .panel-section p {
        font-size: 13px;
        line-height: 1.7;
        margin-bottom: 12px;
        color: var(--normal);
      }
      .section-title {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
        margin-bottom: 10px;
      }
      .meta {
        font-size: 12px;
        line-height: 1.7;
        color: var(--muted);
      }
      .file {
        display: flex;
        width: 100%;
        gap: 10px;
        align-items: center;
        text-align: left;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        padding: 10px 11px;
        margin-top: 6px;
      }
      .file > span {
        min-width: 0;
        flex: 1;
      }
      .file strong {
        display: block;
        font-size: 13px;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .file small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .notice {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.65;
        background: var(--secondary);
      }
      .notice.warning {
        border-left: 3px solid var(--warning);
      }
      .notice.error {
        border-left: 3px solid var(--danger);
      }
      .task-row {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        width: 100%;
        padding: 12px 0;
        border: 0;
        border-bottom: 1px solid var(--border);
        background: transparent;
        text-align: left;
      }
      .task-row > span:nth-child(2) {
        flex: 1;
        min-width: 0;
      }
      .task-row strong {
        display: block;
        font-size: 13px;
        font-weight: 500;
      }
      .task-row small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        margin-top: 4px;
      }
      .task-row .badge {
        margin-top: 1px;
      }
      .task-row svg {
        width: 14px;
        height: 14px;
      }
      .task-detail {
        padding: 12px;
        background: var(--secondary);
        border-radius: 7px;
        font-size: 13px;
        line-height: 1.7;
      }
      .task-detail .btn {
        margin-top: 10px;
      }
      .stage-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        padding-top: 15px;
      }
      .candidate {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
      }
      .candidate h3 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .candidate p {
        font-size: 13px;
        line-height: 1.7;
      }
      .candidate .actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      details {
        font-size: 12px;
        color: var(--muted);
      }
      details summary {
        cursor: pointer;
        padding: 8px 0;
      }
      details p {
        padding-top: 8px;
      }
      .attention {
        position: absolute;
        right: 20px;
        top: 20px;
        width: 320px;
        max-width: calc(100% - 40px);
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        z-index: 20;
      }
      .attention p {
        font-size: 13px;
        line-height: 1.6;
        color: var(--normal);
        margin: 8px 0;
      }
      .canvas-tools {
        position: absolute;
        bottom: 20px;
        left: 24px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        z-index: 10;
      }
      .canvas-tools span {
        font-size: 12px;
        min-width: 40px;
        text-align: center;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .canvas-caption {
        position: absolute;
        bottom: 29px;
        right: 24px;
        color: var(--muted);
        font-size: 12px;
        pointer-events: none;
      }
      .prototype-footer {
        min-height: 42px;
        padding: 10px 24px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
        background: var(--surface);
        display: flex;
        gap: 16px;
        justify-content: space-between;
      }
      .compare-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        max-width: 1000px;
        margin: 24px auto;
      }
      .compare-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
      }
      .compare-card h2 {
        font-size: 18px;
        margin-bottom: 12px;
      }
      .compare-card p,
      .compare-card li {
        font-size: 14px;
        line-height: 1.8;
        color: var(--normal);
      }
      .compare-card .section-title {
        margin-top: 24px;
      }
      .message {
        max-width: 90%;
        font-size: 14px;
        line-height: 1.9;
        margin-top: 24px;
      }
      .message.user {
        margin-left: auto;
        padding: 12px 18px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .message .author {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .composer {
        margin-top: auto;
        padding-top: 32px;
      }
      .composer-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
      }
      .composer textarea {
        width: 100%;
        min-height: 72px;
        resize: vertical;
        background: transparent;
        color: var(--ink);
        border: 0;
        line-height: 1.7;
      }
      .composer-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .conversation-panel {
        overflow: hidden;
      }
      .conversation-header {
        padding: 14px 14px 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .conversation-heading {
        flex: 1;
        min-width: 0;
      }
      .conversation-heading h2 {
        font-size: 14px;
        line-height: 1.5;
      }
      .conversation-heading .meta {
        overflow-wrap: anywhere;
        margin: 5px 0 0;
      }
      .conversation-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .work-switcher {
        padding: 7px 16px;
        background: var(--secondary);
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 12px;
        align-items: center;
        flex-shrink: 0;
      }
      .work-switcher label {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .work-switcher select {
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 10px;
        min-width: 0;
        max-width: 100%;
        flex: 1;
      }
      .conversation-content {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .conversation-messages {
        flex: 1;
        min-height: 80px;
        overflow-y: auto;
        padding: 0 16px 18px;
        scrollbar-gutter: stable;
      }
      .conversation-messages > * {
        overflow-wrap: anywhere;
      }
      .conversation-panel .message.user {
        margin-left: auto;
        margin-right: 0;
        padding: 10px 12px;
        background: var(--secondary);
      }
      .conversation-panel .message {
        max-width: 100%;
        font-size: 13px;
        line-height: 1.8;
        margin-top: 18px;
      }
      .conversation-panel .composer {
        padding: 12px 14px 14px;
        flex-shrink: 0;
        margin: 0;
      }
      .conversation-panel .composer-box {
        padding: 9px 11px;
        border-radius: 9px;
      }
      .conversation-panel .composer textarea {
        resize: none;
        min-height: 52px;
        font-size: 13px;
        display: block;
      }
      .conversation-panel .composer-foot {
        gap: 10px;
        font-size: 11px;
      }
      .conversation-panel .composer-foot span {
        min-width: 0;
      }
      .conversation-panel .composer-foot .btn {
        min-height: 30px;
        padding: 4px 10px;
        font-size: 12px;
      }
      .conversation-status {
        padding: 8px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted);
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .conversation-status > span {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .conversation-status .btn {
        padding: 3px 8px;
        min-height: 28px;
        font-size: 12px;
        white-space: normal;
      }
      .session-link {
        flex-shrink: 0;
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
      }
      .session-link:hover {
        color: var(--ink);
        text-decoration: underline;
      }
      .tool-group {
        margin-top: 22px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 4px 12px;
        background: var(--secondary);
      }
      .delivery-section {
        flex: 0 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }
      .delivery-toggle {
        flex-shrink: 0;
        width: 100%;
        min-height: 42px;
        padding: 10px 16px;
        border: 0;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
        text-align: left;
      }
      .delivery-toggle strong {
        font-weight: 500;
      }
      .delivery-toggle small {
        margin-left: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .delivery-toggle .icon {
        width: 14px;
        height: 14px;
        transition: transform 160ms ease;
      }
      .delivery-toggle[aria-expanded="true"] .icon {
        transform: rotate(180deg);
      }
      .delivery-content {
        min-height: 0;
        flex: 0 1 auto;
        max-height: min(180px, 24dvh);
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 0 16px 14px;
        scrollbar-gutter: stable;
      }

            state.winner &&
            !state.applying &&
            !state.failed &&

      const taskState = (task) =>

      const button = (action, label, primary = false, key = "") =>

          name;

      }
      function section(title, body) {

      }

        $("#toast").hidden = false;

      function saveScroll() {

      function objectSelector(id) {

      function selectObject(id) {

          return;

        if (save) saveConversation();
        const data = conversationData();
        if (!data) return;
        renderedConversationScope = data.scope;
        const saved = conversationState(data.scope);
        const work = data.task ? assignedTasks(data.node.id) : [];
        const context = `${data.source ? "来源 Run 1 · 只读" : state.queued ? "Run 2" : "Run 1"} · ${data.main ? "原主会话" : data.node.title}`;
        const subtitle = `${data.agent} · ${state.scene === "arena" ? "/projects/product-repair · worktree" : "/projects/industry-research"}`;
        const statusText = data.source
          ? "只读查看来源 Run 1 的原会话；本次 Run 2 复用其成果。"
          : state.stopping
            ? "正在停止，等待确认，项目仍保持占用。"
            : data.main
              ? "主 Agent · 讨论不会自动提交工作流操作。"
              : context;
        $("#conversation").innerHTML =
          `<header class="conversation-header"><div class="conversation-heading"><div class="heading-line"><h2 id="conversation-title">${escapeHtml(data.title)}</h2>${badge(data.status)}</div><p class="meta">${escapeHtml(subtitle)}</p></div><div class="conversation-actions"><button class="btn ghost icon-button" data-action="close-conversation" aria-label="关闭会话浮框">×</button></div></header><div class="conversation-status">${state.conversationReturn ? button("conversation-back", state.conversationReturn.label) : ""}<span>${escapeHtml(statusText)}</span><a class="session-link" data-full-session href="${escapeHtml(data.href)}" target="_blank" rel="noopener" title="打开对应 Workspace / Session 的示例路由">完整会话 ↗</a>${data.candidate ? button("compare", "方案对比") : ""}</div>${work.length ? `<div class="work-switcher"><label for="work-session">${escapeHtml(data.node.title)}</label><select id="work-session" aria-label="切换此 Node 的准确工作会话">${work.map((task) => `<option value="${task.id}" ${data.task.id === task.id ? "selected" : ""}>${escapeHtml(task.title)} · ${labels[data.source ? task.state : taskState(task)]}</option>`).join("")}</select></div>` : ""}<div class="conversation-content" id="conversation-content" ${saved.previewFile ? "hidden" : ""}><section class="delivery-section" aria-label="会话关联文件"><button class="delivery-toggle" data-action="toggle-deliverables" aria-expanded="${saved.filesOpen}" aria-controls="delivery-content"><span><strong>交付物 ${data.outputs.length}</strong><small>输入与交接</small></span>${icon("chevron")}</button><div class="delivery-content" id="delivery-content" ${saved.filesOpen ? "" : "hidden"}>${conversationFiles(data)}</div></section><div class="conversation-messages" id="conversation-messages">${conversationMessages(data)}</div><div class="composer"><div class="composer-box"><label class="meta" for="demo-message">${escapeHtml(data.agent)} · 原输入框复用位置</label><textarea id="demo-message" aria-label="静态原型草稿，不发送消息" placeholder="演示草稿，不会发送…" ${data.source ? "disabled" : ""}></textarea><div class="composer-foot"><span>静态示意 · 沿用已有会话组件</span><button class="btn primary" disabled title="演示不发送消息">发送（演示）</button></div></div></div></div><section class="conversation-file-view" id="conversation-file-view" aria-label="会话关联文件预览" ${saved.previewFile ? "" : "hidden"}>${filePreviewContent(saved)}</section>`;
        $("#conversation").dataset.sessionHref = data.href;
        $("#conversation").dataset.workspaceId = data.workspaceId;
        $("#conversation").dataset.sessionId = data.sessionId;
        $("#conversation").dataset.hostId = data.hostId || "local";
        if (data.source) {
          $("#conversation .composer label").textContent = "来源会话 · 只读";
          $("#demo-message").disabled = true;
          $("#demo-message").placeholder =
            "查看来源记录，不在历史执行中发送消息";
        }
        $("#demo-message").value = saved.draft;
        if (saved.previewFile) {
          $("#conversation-file-view").scrollTop = saved.previewScroll;
        } else {
          $("#conversation-messages").scrollTop = saved.scroll;
          $("#delivery-content").scrollTop = saved.fileScroll;
        }
      }
      function toggleDeliverables() {
        const data = conversationData();
        if (!data?.hasSession || state.surface !== "conversation") return;
        const saved = conversationState(data.scope);
        if (saved.filesOpen)
          saved.fileScroll = $("#delivery-content").scrollTop;
        saved.filesOpen = !saved.filesOpen;
        $("#delivery-content").hidden = !saved.filesOpen;
        $('#conversation [data-action="toggle-deliverables"]').setAttribute(
          "aria-expanded",
          String(saved.filesOpen),
        );
        if (saved.filesOpen)
          $("#delivery-content").scrollTop = saved.fileScroll;
      }
      function returnFromFile() {
        const data = conversationData();
        if (!data?.hasSession || state.surface !== "conversation") return;
        const saved = conversationState(data.scope);
        saved.previewFile = null;
        renderConversation(false);
        const source =
          saved.previewReturn && document.querySelector(saved.previewReturn);
        if (source?.getClientRects().length)
          source.focus({ preventScroll: true });
        else
          $('#conversation [data-action="toggle-deliverables"]').focus({
            preventScroll: true,
          });
      }
      function showDialog(title, subtitle, body, actions, action) {
        if (!$("#dialog").open) focusBeforeDialog = document.activeElement;
        dialogAction = action;
        $("#dialog").classList.remove("comparison");
        $("#dialog-title").textContent = title;
        $("#dialog-subtitle").textContent = subtitle;
        $("#dialog-body").innerHTML = body;
        $("#dialog-actions").innerHTML = actions;
        if (!$("#dialog").open) $("#dialog").showModal();
        $("#dialog-title").tabIndex = -1;
        $("#dialog-title").focus();
      }
      function sampleFile(name) {
        if (name.endsWith(".json"))
          return JSON.stringify(
            {
              note: "交互稿中的文件示例，正式格式以运行时协议为准",
              title: name,
              items: tasks.map((task) => task.title),
            },
            null,
            2,
          );
        if (name === "审核意见.md")
          return "# 审核意见\n\n检查对象：研究报告.md\n\n1. 市场规模结论有来源，可保留。\n2. 用户画像中的推测需要标注，建议在交付说明中明确。\n\n建议：由用户确认当前成果是否满足用途。";
        return `# ${name.replace(/\.md$/, "")}\n\n这是用于评审界面层级的示例文件内容。\n\n## 本步结论\n\n按照需求完成当前工作，说明结论依据、尚未确认的部分和后续建议。\n\n## 交接说明\n\n下游收到准确文件引用后实际读取；文件存在不等于执行成功。`;
      }
      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target || target.disabled) return;
        const action = target.dataset.action,
          key = target.dataset.key;
        if (action === "scene") {
          reset(key);
          return;
        }
        if (action === "reset") {
          reset();
          return;
        }
        if (action === "node") {
          selectObject(key);
          return;
        }
        if (action === "edge") {
          selectObject("edge:" + key);
          return;
        }
        if (action === "close-panel") {
          closePanel();
          return;
        }
        if (action === "task") {
          const from =
            state.surface === "conversation" ? conversationData() : null;
          const returnTo =
            from?.node?.id === "split"
              ? {
                  key: state.conversationKey,
                  label: "返回分工清单",
                  parent: state.conversationReturn,
                }
              : state.conversationReturn;
          openSession(
            (from?.source ? "source:" : "") + "task:" + key,
            undefined,
            returnTo,
          );
          return;
        }
        if (action === "conversation-back") {
          const previous = state.conversationReturn;
          if (previous?.key)
            openSession(previous.key, undefined, previous.parent || null);
          else if (previous)
            returnToWorkflow({ details: true, selection: previous.selection });
          return;
        }
        if (action === "source-session") {
          openSession(key, undefined, {
            key:
              state.surface === "conversation" ? state.conversationKey : null,
            selection: state.selected,
            label: "返回本次工作",
            parent: state.conversationReturn,
          });
          return;
        }
        if (action === "main-session") {
          openSession("main");
          return;
        }
        if (action === "existing-session") {
          openSession(key);
          return;
        }
        if (action === "session") {
          openSession("node:" + key);
          return;
        }
        if (action === "task-session") {
          openSession("task:" + key);
          return;
        }
        if (action === "candidate-session") {
          if ($("#dialog").open) {
            focusBeforeDialog = null;
            $("#dialog").close();
          }
          openSession("candidate:" + key);
          return;
        }
        if (action === "compare") {
          saveScroll();
          renderComparison();
          return;
        }
        if (action === "close-conversation") {
          returnToWorkflow();
          return;
        }
        if (action === "files-back") {
          returnFromFile();
          return;
        }
        if (action === "toggle-deliverables") {
          toggleDeliverables();
          return;
        }
        if (action === "failure") {
          reset();
          state.failed = true;
          state.selected =
            state.scene === "review"
              ? "audit"
              : state.scene === "arena"
                ? "arena"
                : "research";
          render();
          selectObject(state.selected);
          return;
        }
        if (action === "zoom-in" || action === "zoom-out") {
          state.zoom = Math.min(
            1.4,
            Math.max(0.5, state.zoom + (action === "zoom-in" ? 0.1 : -0.1)),
          );
          applyViewport();
          return;
        }
        if (action === "recenter") {
          state.pan = { x: 0, y: 0 };
          state.zoom = Math.min(
            1,
            ($("#canvas").clientHeight - 35) / 660,
            ($("#canvas").clientWidth - 50) / 720,
          );
          applyViewport();
          return;
        }
        if (action === "close-dialog") {
          $("#dialog").close();
          return;
        }
        if (action === "file") {
          fileInDialog = key;
          if (state.surface === "conversation") {
            saveConversation();
            const data = conversationData(),
              saved = conversationState(data.scope);
            const fileScope = target.closest("#delivery-content")
              ? "#delivery-content "
              : "#conversation-messages ";
            saved.previewReturn = `${fileScope}[data-action="file"][data-key="${CSS.escape(key)}"]`;
            saved.previewFile = key;
            saved.previewScroll = 0;
            if ($("#dialog").open) {
              focusBeforeDialog = null;
              $("#dialog").close();
            }
            renderConversation(false);
            $("#conversation-file-title")?.focus({ preventScroll: true });
            return;
          }
          showDialog(
            key,
            "当前文件内容 · 此处仅为示例，不代表历史快照",
            `<pre>${escapeHtml(sampleFile(key))}</pre>`,
            button("close-dialog", "关闭") +
              button("download", "下载示例文件", true),
          );
          return;
        }
        if (action === "download") {
          const name =
            state.surface === "conversation"
              ? conversationState(conversationData().scope).previewFile ||
                fileInDialog
              : fileInDialog;
          if (!name) return;
          const url = URL.createObjectURL(
            new Blob([sampleFile(name)], {
              type: "text/plain;charset=utf-8",
            }),
          );
          const link = document.createElement("a");
          link.href = url;
          link.download = name;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          return;
        }
        if (action === "choose") {
          if (state.stopping || state.failed || state.winner) return;
          showDialog(
            "采用方案 " + key.toUpperCase() + "？",
            "选择、应用成果和下游执行分开呈现",
            '<p>采用选定候选的成果，其他候选结果继续保留。应用成功后，Runtime 再按流程推进下游。</p><div class="notice">这是演示操作，不会应用真实代码。</div>',
            button("close-dialog", "取消") +
              button("confirm", "演示采用", true),
            () => {
              state.winner = key;
              state.applying = true;
              state.selected = "arena";
              render();
              const revision = state.revision;
              setTimeout(() => {
                if (state.revision !== revision || state.stopping) return;
                state.applying = false;
                render();
                notify("演示：成果已应用，下游验证开始；工作流尚未全部完成。");
              }, 1400);
            },
          );
          return;
        }
        if (action === "approve" || action === "reject") {
          if (
            state.stopping ||
            state.gatePending ||
            state.gateDecision ||
            !currentNodes().some(
              (node) => node.id === "gate" && node.status === "waiting",
            )
          )
            return;
          state.gatePending = true;
          render();
          const revision = state.revision;
          setTimeout(() => {
            if (state.revision !== revision || state.stopping) return;
            state.gatePending = false;
            state.gateDecision = action === "approve" ? "approve" : "reject";
            render();
            notify(
              action === "approve"
                ? "演示：已批准，进入交付环节。"
                : "演示：已拒绝，保留审核记录，不自动返工。",
            );
          }, 800);
          return;
        }
        if (action === "stop") {
          showDialog(
            "停止本次运行？",
            "保留已经完成的成果与执行记录",
            "<p>向仍在执行的 Agent 发出停止请求。所有相关执行确认停止前，项目仍保持占用。</p>",
            button("close-dialog", "继续运行") +
              button("confirm", "演示停止请求", true),
            () => {
              state.stopping = true;
              render();
              notify("演示：停止请求已发出，尚未确认全部停止。");
            },
          );
          return;
        }
        if (action === "retry") {
          if (state.stopping || state.queued) return;
          const conversation =
            state.surface === "conversation" ? conversationData() : null;
          const isSplit = ["parallel", "manager"].includes(state.scene);
          const retryTitle =
            conversation && !conversation.main
              ? conversation.title
              : isSplit
                ? "用户画像"
                : currentNodes().find((node) => node.id === state.selected)
                    ?.title || "失败执行";
          showDialog(
            "重试此次执行",
            "产生新 Run，来源运行与失败记录继续保留",
            `<p><strong>重试范围</strong><br>${retryTitle}的准确失败执行及受影响下游。</p><p><strong>复用成果</strong><br>${isSplit ? "保留已完成的案例分析。" : "保留范围外已完成的上游成果。"}执行来源由原记录绑定，不按标题猜测。</p><div class="notice">本原型只演示受理后的界面，不启动真实 Agent。</div>`,
            button("close-dialog", "取消") +
              button("confirm", "演示受理", true),
            () => {
              state.queued = true;
              state.panel = true;
              returnToWorkflow({ details: true });
            },
          );
          return;
        }
        if (action === "confirm") {
          const callback = dialogAction;
          $("#dialog").close();
          if (callback) callback();
          return;
        }
        if (action === "results") {
          openSession("main", true);
          return;
        }
        if (action === "nav-demo")
          notify("此稿只演示工作流协作；其他导航沿用现有产品。");
      });
      $("#dialog").addEventListener("close", () => {
        if (
          focusBeforeDialog?.isConnected &&
          focusBeforeDialog.getClientRects().length
        )
          focusBeforeDialog.focus({ preventScroll: true });
      });
      document.addEventListener("change", (event) => {
        if (event.target.id === "work-session") {
          const from = conversationData();
          openSession(
            (from?.source ? "source:" : "") + "task:" + event.target.value,
            undefined,
            state.conversationReturn,
          );
          $("#work-session")?.focus({ preventScroll: true });
        }
      });
      document.addEventListener("input", (event) => {
        if (event.target.id === "demo-message" && renderedConversationScope)
          conversationState(renderedConversationScope).draft =
            event.target.value;
      });
      $("#canvas").addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || event.target.closest("button, .edge-hit"))
          return;
        panGesture = {
          x: event.clientX,
          y: event.clientY,
          originX: state.pan.x,
          originY: state.pan.y,
          moved: false,
          id: event.pointerId,
        };
        $("#canvas").setPointerCapture(event.pointerId);
      });
      $("#canvas").addEventListener("pointermove", (event) => {
        if (!panGesture) return;
        const dx = event.clientX - panGesture.x,
          dy = event.clientY - panGesture.y;
        if (Math.hypot(dx, dy) > 5) panGesture.moved = true;
        if (panGesture.moved) {
          state.pan = {
            x: panGesture.originX + dx,
            y: panGesture.originY + dy,
          };
          $("#canvas").classList.add("dragging");
          applyViewport();
        }
      });
      function endPan(event) {
        if (!panGesture) return;
        if ($("#canvas").hasPointerCapture(event.pointerId))
          $("#canvas").releasePointerCapture(event.pointerId);
        panGesture = null;
        $("#canvas").classList.remove("dragging");
      }
      $("#canvas").addEventListener("pointerup", (event) => endPan(event));
      $("#canvas").addEventListener("pointercancel", endPan);
      document.addEventListener("keydown", (event) => {
        if (
          event.target.matches(".edge-hit") &&
          ["Enter", " "].includes(event.key)
        ) {
          event.preventDefault();
          selectObject("edge:" + event.target.dataset.key);
        }
        if (
          event.key === "Escape" &&
          !event.defaultPrevented &&
          !event.isComposing &&
          !$("#dialog").open &&
          (state.surface === "conversation" || state.panel)
        ) {
          if (state.surface === "conversation") {
            const saved = conversationState(conversationData().scope);
            if (saved.previewFile) {
              event.preventDefault();
              returnFromFile();
              return;
            }
          }
          event.preventDefault();
          closePanel();
        }
      });
      document.querySelectorAll("[data-icon]").forEach((element) => {
        element.innerHTML = icon(element.dataset.icon);
      });
      $(".sidebar nav").innerHTML = [
        ["grid", "Dashboard"],
        ["search", "搜索"],
        ["folder", "项目"],
        ["flow", "工作流"],
        ["agent", "智能体"],
      ]
        .map(
          ([name, label]) =>
            `<button class="nav-item${label === "工作流" ? " active" : ""}" data-action="nav-demo"${label === "工作流" ? ' aria-current="page"' : ""}>${icon(name)}<span class="nav-text">${label}</span></button>`,
        )
        .join("");
      render();
    </script>
  </body>
</html>
